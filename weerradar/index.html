<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>Weerradar — Regen &amp; Onweer</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  :root{
    --bg:#0b1020;
    --panel:rgba(16,22,42,.72);
    --panel-solid:#101627;
    --text:#eef2ff;
    --muted:#9aa6c7;
    --accent:#4cc2ff;
    --rain:#3aa0ff;
    --storm:#ffd23a;
    --danger:#ff5470;
    --ok:#39d98a;
    --radius:18px;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 800px at 80% -10%, #1b2750 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #122046 0%, transparent 55%),
      var(--bg);
    overflow:hidden;
  }

  /* ---------- App layout ---------- */
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* Map */
  #map{position:absolute;inset:0;z-index:1;background:#0a0e1c}
  .leaflet-container{background:#0a0e1c}
  /* subtle dark tone over the basemap */
  .map-tint{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,10,22,.25),rgba(7,10,22,.55))}

  /* ---------- Top status card ---------- */
  .topbar{
    position:relative;z-index:5;margin:14px auto 0;width:min(680px,calc(100% - 24px));
  }
  .status-card{
    background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;gap:16px;align-items:center;
    overflow:hidden;position:relative;
  }
  .status-icon{
    width:64px;height:64px;flex:0 0 auto;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .status-text{flex:1;min-width:0}
  .status-headline{font-size:1.15rem;font-weight:700;line-height:1.25;letter-spacing:.2px}
  .status-sub{color:var(--muted);font-size:.86rem;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .loc-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
    padding:3px 9px;border-radius:999px;font-size:.8rem;color:var(--text);cursor:pointer
  }
  .loc-pill:hover{background:rgba(255,255,255,.12)}
  .temp{font-variant-numeric:tabular-nums;font-weight:700}

  /* alert banner accent on the left */
  .status-card.is-rain{box-shadow:var(--shadow),inset 4px 0 0 var(--rain)}
  .status-card.is-storm{box-shadow:var(--shadow),inset 4px 0 0 var(--storm)}
  .status-card.is-clear{box-shadow:var(--shadow),inset 4px 0 0 var(--ok)}

  /* ---------- Hourly strip ---------- */
  .hours{
    position:relative;z-index:5;margin:10px auto 0;width:min(680px,calc(100% - 24px));
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 6px 12px;
  }
  .hours-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 12px 8px}
  .hours-track{display:flex;gap:2px;overflow-x:auto;padding:0 8px 4px;scrollbar-width:none}
  .hours-track::-webkit-scrollbar{display:none}
  .hour{
    flex:0 0 auto;width:50px;text-align:center;border-radius:12px;padding:8px 2px 6px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .hour .h{font-size:.72rem;color:var(--muted)}
  .hour .bar-wrap{height:54px;width:14px;background:rgba(255,255,255,.07);border-radius:7px;
    position:relative;overflow:hidden;display:flex;align-items:flex-end}
  .hour .bar{width:100%;background:linear-gradient(180deg,var(--rain),#1d6fd0);border-radius:7px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .hour .mm{font-size:.66rem;color:var(--text);font-variant-numeric:tabular-nums;min-height:.9em}
  .hour .ic{font-size:1rem;line-height:1}
  .hour.now{background:rgba(76,194,255,.12);outline:1px solid rgba(76,194,255,.35)}

  /* ---------- Radar controls ---------- */
  .radar-ctrl{
    position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:6;
    width:min(680px,calc(100% - 24px));
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px 14px;
    display:flex;align-items:center;gap:12px;
  }
  .play-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#1d6fd0);color:#04121f;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 6px 18px rgba(76,194,255,.4);transition:transform .15s}
  .play-btn:active{transform:scale(.92)}
  .timeline{flex:1;display:flex;flex-direction:column;gap:4px}
  .timeline-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;cursor:pointer}
  .timeline-prog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),#7ad4ff);border-radius:6px;width:0%}
  .timeline-frame{position:absolute;top:-3px;width:3px;height:14px;background:rgba(255,255,255,.25);border-radius:2px}
  .timeline-meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
  .frame-time{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .nowcast-tag{font-size:.66rem;padding:1px 7px;border-radius:999px;background:rgba(255,210,58,.18);color:var(--storm);border:1px solid rgba(255,210,58,.3)}

  /* ---------- Loading & error ---------- */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(7,10,22,.78);backdrop-filter:blur(6px);text-align:center;padding:24px}
  .overlay.hidden{display:none}
  .spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.15);
    border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay h2{margin:0 0 6px;font-size:1.1rem}
  .overlay p{margin:0;color:var(--muted);font-size:.9rem;max-width:320px}
  .retry-btn{margin-top:16px;background:var(--accent);color:#04121f;border:none;border-radius:10px;
    padding:10px 18px;font-weight:700;cursor:pointer}

  /* ---------- Animated weather icons (pure CSS/SVG) ---------- */
  .wx{width:100%;height:100%}
  .sun-core{transform-origin:32px 32px;animation:spin 22s linear infinite}
  .cloud-puff{animation:drift 6s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
  .raindrop{animation:fall 1.1s linear infinite}
  .raindrop.d2{animation-delay:.35s}
  .raindrop.d3{animation-delay:.7s}
  @keyframes fall{
    0%{transform:translateY(-6px);opacity:0}
    25%{opacity:1}
    100%{transform:translateY(14px);opacity:0}
  }
  .bolt{transform-origin:center;animation:flash 2.4s steps(1) infinite}
  @keyframes flash{0%,92%,100%{opacity:.25}94%,98%{opacity:1}}

  /* rain falling across the whole screen when it's raining now */
  #rainfx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .8s}
  #rainfx.on{opacity:1}
  .streak{position:absolute;top:-12%;width:1.5px;height:90px;
    background:linear-gradient(180deg,rgba(150,200,255,0),rgba(150,200,255,.55));
    animation:streak linear infinite}
  @keyframes streak{to{transform:translateY(120vh)}}

  .leaflet-control-attribution{font-size:9px !important;background:rgba(0,0,0,.4)!important;color:#9aa6c7!important}
  .leaflet-control-attribution a{color:#7ad4ff!important}
  .you-marker{filter:drop-shadow(0 0 6px rgba(76,194,255,.9))}

  @media (max-width:520px){
    .status-headline{font-size:1.02rem}
    .status-icon{width:54px;height:54px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="map-tint"></div>
  <div id="rainfx"></div>

  <div class="topbar">
    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon"></div>
      <div class="status-text">
        <div class="status-headline" id="headline">Weer laden…</div>
        <div class="status-sub">
          <span class="loc-pill" id="locPill" title="Klik om je locatie opnieuw te bepalen">📍 <span id="locName">…</span></span>
          <span class="temp" id="temp"></span>
          <span id="cond"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="hours">
    <div class="hours-title">Neerslag — komende uren</div>
    <div class="hours-track" id="hoursTrack"></div>
  </div>

  <div class="radar-ctrl">
    <button class="play-btn" id="playBtn" aria-label="Afspelen">▶</button>
    <div class="timeline">
      <div class="timeline-bar" id="timelineBar">
        <div class="timeline-prog" id="timelineProg"></div>
      </div>
      <div class="timeline-meta">
        <span class="frame-time" id="frameTime">--:--</span>
        <span id="frameLabel">Radar</span>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div>
    <div class="spinner" id="spinner"></div>
    <h2 id="ovTitle">Locatie bepalen…</h2>
    <p id="ovMsg">We vragen toegang tot je locatie. Sta je dit niet toe, dan tonen we Antwerpen.</p>
    <button class="retry-btn hidden" id="retryBtn">Opnieuw proberen</button>
  </div>
</div>

<script>
"use strict";

/* ====================================================================
   Weerradar — toont of er regen/onweer aankomt op je locatie.
   - Locatie via Geolocation API, anders fallback Antwerpen.
   - Voorspelling via Open-Meteo (gratis, geen key).
   - Geanimeerde radar via RainViewer tiles op een Leaflet-kaart.
   ==================================================================== */

const ANTWERP = { lat: 51.2194, lon: 4.4025, name: "Antwerpen" };

// WMO weather codes → label + of het neerslag/onweer is
const WMO = {
  0:["Helder",""],1:["Overwegend helder",""],2:["Half bewolkt",""],3:["Bewolkt",""],
  45:["Mist",""],48:["Aanvriezende mist",""],
  51:["Lichte motregen","rain"],53:["Motregen","rain"],55:["Dichte motregen","rain"],
  56:["Ijzel","rain"],57:["Dichte ijzel","rain"],
  61:["Lichte regen","rain"],63:["Regen","rain"],65:["Zware regen","rain"],
  66:["Ijzelregen","rain"],67:["Zware ijzelregen","rain"],
  71:["Lichte sneeuw","rain"],73:["Sneeuw","rain"],75:["Zware sneeuw","rain"],77:["Sneeuwkorrels","rain"],
  80:["Lichte buien","rain"],81:["Buien","rain"],82:["Zware buien","rain"],
  85:["Sneeuwbuien","rain"],86:["Zware sneeuwbuien","rain"],
  95:["Onweer","storm"],96:["Onweer met hagel","storm"],99:["Zwaar onweer met hagel","storm"]
};

let map, youMarker, youCircle;
let radarLayers = [];      // Leaflet tile layers per frame
let radarFrames = [];      // frame meta from RainViewer
let radarHost = "";
let curFrame = 0;
let playing = true;
let playTimer = null;
let coords = null;

/* ---------------- DOM helpers ---------------- */
const $ = id => document.getElementById(id);

/* ---------------- Animated SVG weather icons ---------------- */
function iconSun(){
  return `<svg class="wx" viewBox="0 0 64 64"><g class="sun-core">
    <circle cx="32" cy="32" r="13" fill="#ffd23a"/>
    ${Array.from({length:8}).map((_,i)=>{const a=i*Math.PI/4;const x1=32+Math.cos(a)*19,y1=32+Math.sin(a)*19,x2=32+Math.cos(a)*25,y2=32+Math.sin(a)*25;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffd23a" stroke-width="3" stroke-linecap="round"/>`}).join("")}
    </g></svg>`;
}
function cloudPath(fill){
  return `<g class="cloud-puff"><path d="M18 42a10 10 0 0 1 1-19.8A14 14 0 0 1 45 24a9 9 0 0 1 2 17.8z" fill="${fill}"/></g>`;
}
function iconCloud(){return `<svg class="wx" viewBox="0 0 64 64">${cloudPath("#c3cee0")}</svg>`;}
function iconPartly(){
  return `<svg class="wx" viewBox="0 0 64 64">
    <g class="sun-core" transform="translate(8 -4) scale(.7)"><circle cx="32" cy="32" r="11" fill="#ffd23a"/>
    ${Array.from({length:8}).map((_,i)=>{const a=i*Math.PI/4;const x1=32+Math.cos(a)*16,y1=32+Math.sin(a)*16,x2=32+Math.cos(a)*22,y2=32+Math.sin(a)*22;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffd23a" stroke-width="3" stroke-linecap="round"/>`}).join("")}</g>
    ${cloudPath("#d7e0f0")}</svg>`;
}
function iconRain(){
  return `<svg class="wx" viewBox="0 0 64 64">${cloudPath("#b6c4dc")}
    <g stroke="#4cc2ff" stroke-width="3" stroke-linecap="round">
      <line class="raindrop"    x1="24" y1="46" x2="22" y2="52"/>
      <line class="raindrop d2" x1="33" y1="46" x2="31" y2="52"/>
      <line class="raindrop d3" x1="42" y1="46" x2="40" y2="52"/>
    </g></svg>`;
}
function iconStorm(){
  return `<svg class="wx" viewBox="0 0 64 64">${cloudPath("#9aa6c7")}
    <g stroke="#4cc2ff" stroke-width="3" stroke-linecap="round">
      <line class="raindrop"    x1="22" y1="46" x2="20" y2="52"/>
      <line class="raindrop d3" x1="42" y1="46" x2="40" y2="52"/>
    </g>
    <polygon class="bolt" points="34,40 27,53 32,53 28,62 41,49 35,49 39,40" fill="#ffd23a"/>
  </svg>`;
}
function iconFog(){
  return `<svg class="wx" viewBox="0 0 64 64">${cloudPath("#c3cee0")}
    <g stroke="#9aa6c7" stroke-width="3" stroke-linecap="round" class="cloud-puff">
      <line x1="16" y1="48" x2="44" y2="48"/><line x1="20" y1="55" x2="48" y2="55"/></g></svg>`;
}
function pickIcon(code){
  const kind = (WMO[code]||["",""])[1];
  if(kind==="storm") return iconStorm();
  if(kind==="rain")  return iconRain();
  if(code===45||code===48) return iconFog();
  if(code===0||code===1) return iconSun();
  if(code===2) return iconPartly();
  return iconCloud();
}

/* ---------------- Full-screen rain effect ---------------- */
function setRainFx(on){
  const fx = $("rainfx");
  if(on && !fx.dataset.built){
    let html="";
    for(let i=0;i<70;i++){
      const left=Math.random()*100;
      const dur=(0.5+Math.random()*0.6).toFixed(2);
      const delay=(Math.random()*2).toFixed(2);
      const h=(50+Math.random()*60).toFixed(0);
      html+=`<div class="streak" style="left:${left}%;height:${h}px;animation-duration:${dur}s;animation-delay:-${delay}s"></div>`;
    }
    fx.innerHTML=html; fx.dataset.built="1";
  }
  fx.classList.toggle("on", on);
}

/* ---------------- Geolocation with Antwerp fallback ---------------- */
function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({...ANTWERP, fallback:true}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude, name:null, fallback:false }),
      ()  => resolve({...ANTWERP, fallback:true}),
      { enableHighAccuracy:true, timeout:8000, maximumAge:300000 }
    );
  });
}

/* ---------------- Reverse geocode (best-effort) ---------------- */
async function resolveName(lat, lon){
  try{
    // BigDataCloud free reverse geocoding (no key) to turn coords into a place name.
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=nl`);
    if(r.ok){const j=await r.json(); return j.city||j.locality||j.principalSubdivision||"Jouw locatie";}
  }catch(e){}
  return "Jouw locatie";
}

/* ---------------- Forecast via Open-Meteo ---------------- */
async function loadForecast(lat, lon){
  const u = `https://api.open-meteo.com/v1/forecast`+
    `?latitude=${lat}&longitude=${lon}`+
    `&current=temperature_2m,weather_code,precipitation,is_day`+
    `&hourly=precipitation,precipitation_probability,weather_code`+
    `&forecast_days=2&timezone=auto`;
  const r = await fetch(u);
  if(!r.ok) throw new Error("Forecast API "+r.status);
  return r.json();
}

/* Decide the headline: is there rain/storm coming in the next hours? */
function analyse(data){
  const now = new Date();
  const times = data.hourly.time.map(t=>new Date(t));
  // index of first hour >= now
  let start = times.findIndex(t=>t>=now);
  if(start<0) start = 0;
  const slice = i => start+i;

  const next = [];
  for(let i=0;i<14 && slice(i)<times.length;i++){
    const idx=slice(i);
    next.push({
      time: times[idx],
      mm: data.hourly.precipitation[idx] ?? 0,
      prob: data.hourly.precipitation_probability?.[idx] ?? null,
      code: data.hourly.weather_code[idx]
    });
  }

  // find first storm and first rain within the window
  let firstStorm=-1, firstRain=-1;
  next.forEach((h,i)=>{
    const kind=(WMO[h.code]||["",""])[1];
    const wet = h.mm>=0.1 || (h.prob!=null && h.prob>=50);
    if(kind==="storm" && firstStorm<0) firstStorm=i;
    if((kind==="rain"||kind==="storm"||wet) && firstRain<0) firstRain=i;
  });

  return { next, firstStorm, firstRain, start };
}

function fmtHour(d){return d.toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});}
function relHour(d){
  const diff=Math.round((d-new Date())/3.6e6);
  if(diff<=0) return "nu";
  if(diff===1) return "over 1 uur";
  return "over "+diff+" uur";
}

function render(data, locName){
  const cur = data.current;
  const [label, kind] = WMO[cur.weather_code] || ["Onbekend",""];
  const a = analyse(data);

  // Headline logic
  const card=$("statusCard");
  card.classList.remove("is-rain","is-storm","is-clear");
  let headline, iconKind;

  const rainingNow = (cur.precipitation??0) >= 0.1 || kind==="rain" || kind==="storm";

  if(a.firstStorm>=0){
    const h=a.next[a.firstStorm];
    iconKind="storm";
    headline = a.firstStorm===0
      ? "⛈️ Onweer op dit moment"
      : `⛈️ Onweer verwacht ${relHour(h.time)}`;
    card.classList.add("is-storm");
  } else if(a.firstRain>=0){
    const h=a.next[a.firstRain];
    iconKind="rain";
    headline = a.firstRain===0
      ? "🌧️ Het regent nu"
      : `🌧️ Regen verwacht ${relHour(h.time)}`;
    card.classList.add("is-rain");
  } else {
    iconKind="clear";
    headline = "☀️ Voorlopig droog";
    card.classList.add("is-clear");
  }

  $("headline").textContent = headline;
  $("statusIcon").innerHTML = pickIcon(cur.weather_code);
  $("temp").textContent = Math.round(cur.temperature_2m)+"°";
  $("cond").textContent = label;
  $("locName").textContent = locName;

  setRainFx(rainingNow);

  // Hourly strip
  const track=$("hoursTrack");
  const maxMm=Math.max(0.5,...a.next.map(h=>h.mm));
  track.innerHTML = a.next.map((h,i)=>{
    const pct=Math.min(100,(h.mm/maxMm)*100);
    const mmTxt=h.mm>=0.05? h.mm.toFixed(1).replace(".",",") : "";
    const k=(WMO[h.code]||["",""])[1];
    const ic = k==="storm"?"⛈️":k==="rain"?"🌧️":(h.code<=1?"☀️":h.code===2?"⛅":"☁️");
    return `<div class="hour ${i===0?'now':''}">
      <div class="h">${i===0?'nu':fmtHour(h.time)}</div>
      <div class="ic">${ic}</div>
      <div class="bar-wrap"><div class="bar" style="height:${pct}%"></div></div>
      <div class="mm">${mmTxt}</div>
    </div>`;
  }).join("");
}

/* ====================================================================
   RADAR — RainViewer animated tiles on Leaflet
   ==================================================================== */
function initMap(lat, lon){
  map = L.map("map", {
    center:[lat,lon], zoom:8, zoomControl:false, attributionControl:true
  });
  L.control.zoom({position:"topright"}).addTo(map);

  // Dark basemap (CARTO)
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
    subdomains:"abcd", maxZoom:19,
    attribution:'&copy; OpenStreetMap &copy; CARTO · Radar: RainViewer · Weer: Open-Meteo'
  }).addTo(map);

  // "You are here" marker
  const dot = L.divIcon({className:"you-marker",
    html:`<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="6" fill="#4cc2ff" stroke="#fff" stroke-width="2"/></svg>`,
    iconSize:[26,26], iconAnchor:[13,13]});
  youMarker = L.marker([lat,lon],{icon:dot}).addTo(map);
  youCircle = L.circle([lat,lon],{radius:1500,color:"#4cc2ff",weight:1,fillOpacity:.08}).addTo(map);
}

async function loadRadar(){
  const r = await fetch("https://api.rainviewer.com/public/weather-maps.json");
  if(!r.ok) throw new Error("Radar API "+r.status);
  const j = await r.json();
  radarHost = j.host;
  const past = j.radar?.past || [];
  const nowcast = j.radar?.nowcast || [];
  radarFrames = [...past, ...nowcast.map(f=>({...f, nowcast:true}))];

  // build a tile layer per frame (hidden until shown)
  radarLayers.forEach(l=>map.removeLayer(l));
  radarLayers = radarFrames.map(f=>{
    const url = `${radarHost}${f.path}/256/{z}/{x}/{y}/2/1_1.png`;
    return L.tileLayer(url,{opacity:0, zIndex:5, maxZoom:19, tileSize:256});
  });
  radarLayers.forEach(l=>l.addTo(map));

  // start near the most recent "past" frame
  curFrame = Math.max(0, past.length-1);
  buildTimelineTicks();
  showFrame(curFrame);
  startPlay();
}

function buildTimelineTicks(){
  const bar=$("timelineBar");
  // clear old ticks
  bar.querySelectorAll(".timeline-frame").forEach(e=>e.remove());
  radarFrames.forEach((f,i)=>{
    const t=document.createElement("div");
    t.className="timeline-frame";
    t.style.left = (i/(radarFrames.length-1)*100)+"%";
    bar.appendChild(t);
  });
}

function showFrame(i){
  if(!radarLayers.length) return;
  curFrame = (i+radarFrames.length)%radarFrames.length;
  radarLayers.forEach((l,idx)=> l.setOpacity(idx===curFrame?0.8:0));
  const f=radarFrames[curFrame];
  const d=new Date(f.time*1000);
  $("frameTime").textContent = d.toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
  $("timelineProg").style.width = (curFrame/(radarFrames.length-1)*100)+"%";
  $("frameLabel").innerHTML = f.nowcast
    ? `<span class="nowcast-tag">voorspelling</span>`
    : (curFrame===indexOfLastPast()? "nu" : "verleden");
}
function indexOfLastPast(){
  let last=0; radarFrames.forEach((f,i)=>{ if(!f.nowcast) last=i; }); return last;
}

function startPlay(){
  playing=true; $("playBtn").textContent="⏸";
  clearInterval(playTimer);
  playTimer=setInterval(()=>{
    const n=(curFrame+1)%radarFrames.length;
    showFrame(n);
  }, 600);
}
function stopPlay(){ playing=false; $("playBtn").textContent="▶"; clearInterval(playTimer); }
function togglePlay(){ playing?stopPlay():startPlay(); }

/* timeline scrubbing */
function bindTimeline(){
  const bar=$("timelineBar");
  const seek=e=>{
    const rect=bar.getBoundingClientRect();
    const x=( (e.touches?e.touches[0].clientX:e.clientX) - rect.left)/rect.width;
    const i=Math.round(Math.min(1,Math.max(0,x))*(radarFrames.length-1));
    stopPlay(); showFrame(i);
  };
  bar.addEventListener("click",seek);
  let dragging=false;
  bar.addEventListener("mousedown",()=>dragging=true);
  window.addEventListener("mouseup",()=>dragging=false);
  window.addEventListener("mousemove",e=>{if(dragging)seek(e);});
  bar.addEventListener("touchstart",seek,{passive:true});
  bar.addEventListener("touchmove",seek,{passive:true});
}

/* ====================================================================
   BOOT
   ==================================================================== */
async function boot(){
  $("ovTitle").textContent="Locatie bepalen…";
  $("retryBtn").classList.add("hidden");
  $("spinner").classList.remove("hidden");

  try{
    const loc = await getLocation();
    coords = loc;

    let name = loc.name;
    if(!name){
      name = loc.fallback ? ANTWERP.name : await resolveName(loc.lat, loc.lon);
    }

    initMap(loc.lat, loc.lon);

    // load forecast + radar in parallel
    const [fc] = await Promise.all([
      loadForecast(loc.lat, loc.lon),
      loadRadar().catch(e=>{ console.warn("radar:",e); }) // radar is non-fatal
    ]);

    render(fc, name + (loc.fallback?" (standaard)":""));

    $("overlay").classList.add("hidden");

    // periodic refresh
    setInterval(async()=>{
      try{ const f=await loadForecast(loc.lat,loc.lon); render(f,name+(loc.fallback?" (standaard)":"")); }catch(e){}
    }, 10*60*1000);
    setInterval(()=> loadRadar().catch(()=>{}), 5*60*1000);

  }catch(err){
    console.error(err);
    $("spinner").classList.add("hidden");
    $("ovTitle").textContent="Er ging iets mis";
    $("ovMsg").textContent="Kon de weergegevens niet laden. Controleer je internetverbinding en probeer opnieuw.";
    $("retryBtn").classList.remove("hidden");
  }
}

/* events */
$("playBtn").addEventListener("click", togglePlay);
$("retryBtn").addEventListener("click", ()=>{$("overlay").classList.remove("hidden");$("spinner").classList.remove("hidden");boot();});
$("locPill").addEventListener("click", ()=>{
  // force a fresh location request
  $("overlay").classList.remove("hidden");
  if(map){ map.remove(); map=null; radarLayers=[]; }
  boot();
});
bindTimeline();
boot();
</script>
