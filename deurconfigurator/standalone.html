<style>
/* Binnendeuren configurator — styling */
:root {
  --teal: #155e5b;
  --teal-d: #0d3f3d;
  --lime: #7ea63a;          /* verfijnder, meer olijf */
  --clay: #c07a52;          /* warme accenttint (hout) */
  --ink: #202528;
  --muted: #6c716f;
  --line: #e7e2d7;
  --line-2: #d9d3c6;
  --bg: #f4f1ea;
  --bg-2: #efeadf;
  --panel: #ffffff;
  --sel: #155e5b;
  --sel-bg: #e9f1ef;
  --r-sm: 10px;
  --radius: 16px;
  --r-lg: 22px;
  --shadow: 0 4px 18px rgba(24, 40, 38, .07);
  --shadow-2: 0 14px 40px rgba(24, 40, 38, .13);
  --maxw: 1120px;
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { letter-spacing: -0.02em; text-wrap: balance; }

/* header */
.site-header {
  background: linear-gradient(135deg, var(--teal-d) 0%, var(--teal) 70%, #1a6b64 100%);
  color: #fff;
  padding: 16px 22px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 14px rgba(13, 63, 61, .18);
}
.site-header .inner { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.logo-mark { display: grid; place-items: center; background: rgba(255,255,255,.12); border-radius: 12px; width: 46px; height: 46px; }
.site-header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.site-header .sub { font-size: 12.5px; opacity: .82; margin: 1px 0 0; }

/* modus-schakelaar */
.mode-switch { margin-left: auto; display: flex; gap: 4px; background: rgba(255,255,255,.14); padding: 4px; border-radius: 999px; }
.mode-btn {
  font: inherit; font-size: 13px; font-weight: 600; border: none; background: transparent; color: #fff;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; opacity: .8; white-space: nowrap;
}
.mode-btn.on { background: #fff; color: var(--teal-d); opacity: 1; }

/* audience-keuze op intro */
.aud-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 auto 24px; max-width: 720px; }
.aud-card {
  display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; font: inherit;
  border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; cursor: pointer; transition: .15s;
}
.aud-card:hover { border-color: #b9d0ce; transform: translateY(-2px); }
.aud-card.sel { border-color: var(--teal); background: var(--sel-bg); }
.aud-ic { font-size: 30px; }
.aud-txt { flex: 1; }
.aud-txt strong { display: block; font-size: 15px; }
.aud-txt small { color: var(--muted); font-size: 12.5px; }
.aud-check { width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 800; opacity: 0; }
.aud-card.sel .aud-check { opacity: 1; }

/* stepper */
#stepper {
  max-width: var(--maxw); margin: 0 auto; padding: 18px 22px 2px;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
#stepper::-webkit-scrollbar { display: none; }
.step-dot {
  display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  white-space: nowrap; flex: 0 0 auto;
}
.step-dot .num {
  width: 20px; height: 20px; border-radius: 50%; background: #eceae4; color: var(--muted);
  display: grid; place-items: center; font-weight: 700; font-size: 11px;
}
.step-dot.active { border-color: var(--teal); color: var(--teal); font-weight: 600; }
.step-dot.active .num { background: var(--teal); color: #fff; }
.step-dot.done { cursor: pointer; }
.step-dot.done .num { background: var(--lime); color: #fff; }

/* layout */
main { max-width: var(--maxw); margin: 0 auto; padding: 22px 22px 130px; }

/* twee-koloms layout met live preview */
.config-layout { display: grid; grid-template-columns: 320px 1fr; gap: 22px; align-items: start; }
.preview-aside { position: sticky; top: 86px; }
.preview-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.preview-door { background: linear-gradient(160deg,#f2efe9,#e7e3da); border-radius: 12px; padding: 16px 30px; }
.preview-door .big-svg { max-height: 340px; }
.preview-info { text-align: center; margin-top: 12px; }
.pi-line { font-weight: 700; font-size: 15px; }
.pi-finish { color: var(--teal); font-weight: 600; font-size: 13.5px; }
.pi-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.pi-price { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.pip-val { display: block; font-size: 24px; font-weight: 800; color: var(--teal-d); }
.pip-lbl { font-size: 11px; color: var(--muted); }
.config-main .panel { padding: 22px; }
@media (max-width: 820px) {
  .config-layout { grid-template-columns: 1fr; }
  .preview-aside { position: static; }
  .preview-door .big-svg { max-height: 220px; }
}
.panel {
  background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 30px; border: 1px solid var(--line);
}
h2 { font-size: 26px; margin: 0 0 6px; font-weight: 750; }
h3 { font-size: 16px; margin: 0 0 10px; }
.sub, .grp-blurb { color: var(--muted); font-size: 14px; margin: 0 0 14px; max-width: 68ch; }

/* hero */
.hero { text-align: center; }
.hero-badge {
  display: inline-block; background: var(--sel-bg); color: var(--teal); font-weight: 700;
  font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  padding: 6px 13px; border-radius: 999px; margin-bottom: 12px;
}
.hero h1 { font-size: 38px; margin: 8px 0; line-height: 1.08; }
.hero .lead { max-width: 640px; margin: 0 auto 24px; color: var(--muted); font-size: 16px; line-height: 1.55; }
.usp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 8px 0 28px; }
.usp { background: var(--bg); border-radius: 14px; padding: 18px; text-align: left; border: 1px solid var(--line); }
.usp-ic { font-size: 26px; }
.usp strong { display: block; margin: 8px 0 2px; font-size: 14px; }
.usp span { font-size: 12.5px; color: var(--muted); }

/* buttons */
.btn {
  font: inherit; border: 1px solid var(--line-2); background: #fff; color: var(--ink);
  padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 650; transition: .16s;
  letter-spacing: -0.01em;
}
.btn:hover { border-color: #bdb7aa; transform: translateY(-1px); }
.btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); box-shadow: 0 4px 14px rgba(21,94,91,.22); }
.btn.primary:hover { background: var(--teal-d); box-shadow: 0 6px 18px rgba(21,94,91,.28); }
.btn.primary:disabled { background: #b9c4c3; border-color: #b9c4c3; cursor: not-allowed; box-shadow: none; transform: none; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn:focus-visible { outline: 3px solid rgba(21,94,91,.4); outline-offset: 2px; }
.btn.lg { padding: 14px 24px; font-size: 15px; }
.btn-row { display: flex; gap: 12px; justify-content: space-between; margin-top: 26px; flex-wrap: wrap; }
.btn-row .primary { margin-left: auto; }

/* advies-vragen */
.q-block { margin: 18px 0; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.opt-grid.narrow { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
.opt {
  font: inherit; text-align: left; background: #fff; border: 1.5px solid var(--line);
  border-radius: 11px; padding: 13px 15px; cursor: pointer; transition: .12s; color: var(--ink); line-height: 1.35;
}
.opt small { color: var(--muted); font-size: 12px; }
.opt:hover { border-color: #b9d0ce; }
.opt.sel { border-color: var(--sel); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel); }
.opt-ic { display: flex; align-items: center; gap: 10px; }
.opt-ic .o-ic { font-size: 22px; line-height: 1; flex: 0 0 auto; }

/* advies-banner */
.advice-banner {
  display: flex; align-items: center; gap: 12px; background: linear-gradient(100deg, #f0f7ee, #e8f1f0);
  border: 1px solid #cfe3d3; border-radius: 12px; padding: 14px 16px; margin: 6px 0 18px;
}
.advice-banner .star { font-size: 22px; color: var(--lime); }
.advice-banner strong { color: var(--teal-d); }

/* productlijnen */
.line-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.line-card {
  position: relative; border: 1.5px solid var(--line); border-radius: 14px; padding: 18px;
  cursor: pointer; transition: .15s; background: #fff; overflow: hidden;
}
.line-card:hover { border-color: #b9d0ce; transform: translateY(-2px); }
.line-card.sel { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.line-card.best { border-color: var(--lime); box-shadow: 0 8px 24px rgba(139,191,42,.18); }
.line-card .ribbon {
  position: absolute; top: 12px; right: -34px; transform: rotate(45deg);
  background: var(--lime); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 40px;
}
.line-badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--teal); background: var(--sel-bg); padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; }
.line-card h3 { margin: 0 0 6px; }
.line-card p { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.line-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 700; color: var(--ink); font-size: 14px; }
.line-meta .tag { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 999px; }

/* afwerking swatches */
.finish-group { margin: 18px 0; }
.swatch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.swatch {
  display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line);
  border-radius: 11px; padding: 8px 10px; cursor: pointer; font: inherit; text-align: left; transition: .12s;
}
.swatch:hover { border-color: #b9d0ce; }
.swatch.sel { border-color: var(--sel); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel); }
.swatch .chip { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.sw-name { font-size: 13px; font-weight: 600; }

/* modellen */
.model-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.model-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; font: inherit; transition: .12s;
}
.model-card:hover { border-color: #b9d0ce; }
.model-card.sel { border-color: var(--sel); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel); }
.model-card small { color: var(--muted); font-size: 11.5px; }
.model-prev { width: 46px; }
.mini-svg { width: 46px; height: 92px; }

/* range */
.range-row { display: flex; align-items: center; gap: 16px; }
.range-row input[type=range] { flex: 1; accent-color: var(--teal); }
.range-val { font-weight: 700; font-size: 18px; color: var(--teal); min-width: 78px; }

/* stepper controls */
.stepper-ctl { display: flex; align-items: center; gap: 12px; }
.stepper-ctl.big span { font-size: 22px; font-weight: 700; min-width: 32px; text-align: center; }
.rnd { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; }
.rnd:hover { border-color: var(--teal); color: var(--teal); }
.extra-list { display: flex; flex-direction: column; gap: 8px; }
.extra-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; }
.extra-row small { color: var(--muted); }

/* resultaat */
.result-grid { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
.result-preview { position: sticky; top: 12px; }
.door-shell { background: var(--bg); border-radius: 12px; padding: 12px; }
.big-svg { width: 100%; height: auto; max-height: 420px; display: block; }
.spec-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.spec-row .k { color: var(--muted); }
.spec-row .v { font-weight: 600; text-align: right; }

/* prijsopbouw */
.price-breakdown { margin-top: 22px; background: var(--bg); border-radius: 12px; padding: 18px 20px; }
.pl { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
.pl.sub { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 700; }
.pl.total { border-top: 2px solid var(--teal); margin-top: 8px; padding-top: 12px; font-size: 20px; font-weight: 800; color: var(--teal-d); }
.disclaimer { font-size: 12px; color: var(--muted); margin: 14px 2px 0; }

/* offerte-box */
.quote-box { margin-top: 24px; border: 1.5px solid var(--teal); border-radius: 14px; padding: 22px; background: #fbfdfc; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .quote-box textarea {
  font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; width: 100%;
}
.field input:focus, .quote-box textarea:focus { outline: none; border-color: var(--teal); }
.quote-box textarea { margin-bottom: 12px; }
.chk { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.quote-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.quote-msg { margin-top: 12px; font-size: 14px; }
.quote-msg.ok { color: var(--teal-d); font-weight: 600; }
.quote-msg.err { color: #b23b2e; font-weight: 600; }
.quote-msg a { color: var(--teal); }

/* sticky samenvatting */
#summary-bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
  box-shadow: 0 -4px 20px rgba(0,0,0,.06); transform: translateY(110%); transition: .25s; z-index: 40;
}
#summary-bar.show { transform: translateY(0); }
#summary-bar .inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
#sum-line { font-weight: 700; }
#sum-detail { color: var(--muted); font-size: 13px; }
#summary-bar .price { margin-left: auto; text-align: right; }
#sum-price { font-size: 22px; font-weight: 800; color: var(--teal-d); display: block; }
#summary-bar .price small { color: var(--muted); font-size: 11px; }

/* responsive */
@media (max-width: 760px) {
  .usp-grid { grid-template-columns: repeat(2, 1fr); }
  .result-grid { grid-template-columns: 1fr; }
  .result-preview { position: static; max-width: 220px; margin: 0 auto; }
  .form-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 26px; }
  #sum-detail { display: none; }
}

/* ===== startkeuze ===== */
.start-hero { text-align: center; }
.start-hero h1 { font-size: 30px; margin: 8px 0; }
.start-hero .lead { color: var(--muted); max-width: 560px; margin: 0 auto 24px; }
.start-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 760px; margin: 0 auto; }
.start-card {
  position: relative; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 16px;
  padding: 24px; cursor: pointer; font: inherit; transition: .16s; display: flex; flex-direction: column; gap: 8px;
}
.start-card:hover { transform: translateY(-3px); border-color: #b9d0ce; box-shadow: 0 12px 30px rgba(20,40,40,.1); }
.start-card.feature { border-color: var(--teal); background: linear-gradient(160deg,#fbfdfc,#eef5f4); }
.sc-ic { font-size: 40px; }
.start-card h3 { margin: 4px 0; font-size: 18px; }
.start-card p { color: var(--muted); font-size: 14px; margin: 0; flex: 1; }
.sc-go { color: var(--teal); font-weight: 700; margin-top: 8px; }
.sc-badge { display: inline-block; background: var(--lime); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-top: 6px; align-self: flex-start; }

/* ===== bouwselector ===== */
.upload-zone {
  display: flex; align-items: center; gap: 16px; border: 2px dashed #c3ccca; border-radius: 12px;
  padding: 20px 22px; cursor: pointer; background: #fbfdfc; transition: .15s;
}
.upload-zone:hover { border-color: var(--teal); background: #f2f8f7; }
.uz-ic { font-size: 30px; }
.plan-thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.plan-thumb { position: relative; width: 90px; height: 90px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.plan-thumb img { width: 100%; height: 100%; object-fit: cover; }
.pt-pdf { padding: 8px; font-size: 11px; word-break: break-word; }
.pt-del { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 11px; }
.hometype-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.hometype { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; cursor: pointer; font: inherit; transition: .14s; }
.hometype:hover { border-color: var(--teal); transform: translateY(-2px); }
.ht-ic { font-size: 30px; }
.hometype small { color: var(--muted); }
.door-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.dr-head, .door-row { display: grid; grid-template-columns: 1fr 120px 110px 120px 40px; gap: 10px; align-items: center; }
.dr-head { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px; }
.door-row { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.dr-room { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.dr-field { display: flex; flex-direction: column; gap: 2px; }
.dr-field label { font-size: 10px; color: var(--muted); }
.dr-field select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: #fff; }
.mini-step { display: flex; align-items: center; gap: 6px; }
.mini-step button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
.mini-step span { min-width: 20px; text-align: center; font-weight: 700; }
.dr-del { border: none; background: none; cursor: pointer; font-size: 16px; }
.bouw-lines { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.bl-btn { font: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.bl-btn.sel { border-color: var(--teal); background: var(--sel-bg); color: var(--teal-d); }
.bouw-foot { background: var(--bg); }
.bouw-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.bs-total { text-align: right; }
.bs-total span { display: block; font-size: 12px; color: var(--muted); }
.bs-total strong { font-size: 24px; color: var(--teal-d); }

@media (max-width: 760px) {
  .start-choice { grid-template-columns: 1fr; }
  .hometype-grid { grid-template-columns: 1fr; }
  .dr-head { display: none; }
  .door-row { grid-template-columns: 1fr 1fr; }
  .dr-room { grid-column: 1 / -1; }
}

/* ===== bouwselector: aanpak-keuze ===== */
.approach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.approach-card { display: flex; flex-direction: column; gap: 6px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer; font: inherit; transition: .15s; }
.approach-card:hover { border-color: #b9d0ce; transform: translateY(-2px); }
.approach-card.feature { border-color: var(--teal); background: linear-gradient(160deg,#fbfdfc,#eef5f4); }
.ap-ic { font-size: 30px; }
.approach-card strong { font-size: 15.5px; }
.approach-card small { color: var(--muted); font-size: 13px; }
.quick-finish { margin-top: 16px; }

/* ===== model-foto's ===== */
.model-grid.photo { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.model-photo { width: 100%; }
.model-photo svg { width: 100%; height: auto; border-radius: 8px; display: block; }

/* ===== inbegrepen-box ===== */
.incl-box { background: #f4f8f4; border: 1px solid #d3e6d6; border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
.incl-box.compact { padding: 10px 12px; margin: 0; }
.incl-head { font-weight: 700; color: var(--teal-d); margin-bottom: 8px; }
.incl-list { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; }
.incl-box.compact .incl-list { grid-template-columns: 1fr; }
.incl-list li { font-size: 13px; padding-left: 18px; position: relative; }
.incl-list li::before { content: "✓"; position: absolute; left: 0; color: var(--lime); font-weight: 800; }
.incl-note { margin-top: 10px; font-size: 12.5px; color: #8a6a1a; background: #fbf3e6; border-radius: 8px; padding: 8px 10px; }

/* ===== draairichting-vergelijking (Loft / Loft Plus) ===== */
.swing-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swingc-card { display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; transition: .14s; }
.swingc-card:hover { border-color: #b9d0ce; }
.swingc-card.sel { border-color: var(--teal); background: var(--sel-bg); }
.swc-fig { width: 84px; flex: 0 0 auto; }
.swing-svg { width: 84px; height: 64px; }
.swc-txt strong { display: block; font-size: 14px; }
.swc-sub { font-size: 11.5px; color: var(--teal); font-weight: 600; }
.swc-txt small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
@media (max-width: 620px) { .swing-compare { grid-template-columns: 1fr; } }

/* ===== plan-herkenning ===== */
.plan-recognize { margin-top: 14px; }
.pr-busy { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--teal-d); }
.pr-spin { width: 20px; height: 20px; border: 3px solid #e3e0d9; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
.pr-done { display: inline-block; margin-left: 12px; color: #3d7a24; font-weight: 600; font-size: 13.5px; }

/* ===== per-ruimte advies + accessoires ===== */
.walk-advice { display: flex; align-items: center; gap: 12px; background: linear-gradient(100deg,#f0f7ee,#e8f1f0); border: 1px solid #cfe3d3; border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 13.5px; }
.wa-star { font-size: 20px; color: var(--lime); }
.walk-advice strong { color: var(--teal-d); }
.wa-ok { margin-left: auto; color: #3d7a24; font-weight: 700; white-space: nowrap; }
.walk-advice .btn.sm { margin-left: auto; padding: 6px 12px; font-size: 12.5px; white-space: nowrap; }
.acc-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.acc-lbl { font-size: 12px; color: var(--muted); font-weight: 600; width: 44px; padding-top: 7px; }
.acc-opts { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.acc-pill { font: inherit; font-size: 12.5px; border: 1.5px solid var(--line); background: #fff; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.acc-pill.sel { border-color: var(--teal); background: var(--sel-bg); color: var(--teal-d); }
.acc-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* ===== architect-rondgang ===== */
.panel.walk { padding: 0; overflow: hidden; }
.walk-top { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
.walk-prog { flex: 1; }
.walk-prog span { font-size: 12px; color: var(--muted); }
.wp-bar { height: 7px; background: #eceae4; border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
.wp-bar i { display: block; height: 100%; background: var(--lime); transition: width .3s; }
.walk-head { padding: 18px 22px 0; }
.walk-room { font: inherit; font-size: 22px; font-weight: 800; border: none; border-bottom: 2px dashed var(--line); padding: 2px 0; width: 100%; max-width: 420px; color: var(--ink); }
.walk-room:focus { outline: none; border-bottom-color: var(--teal); }
.walk-tip { display: flex; align-items: flex-start; gap: 8px; background: #f0f7ee; border-left: 3px solid var(--lime); border-radius: 8px; padding: 10px 14px; margin: 12px 0 0; font-size: 13.5px; }
.wt-ic { font-size: 18px; }
.walk-layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; padding: 18px 22px 22px; align-items: start; }
.walk-preview { position: sticky; top: 12px; }
.walk-preview .preview-door { background: linear-gradient(160deg,#f4f1eb,#e9e4da); border-radius: 12px; padding: 14px 26px; }
.walk-preview .preview-door svg { max-height: 360px; }
.walk-block { margin-bottom: 22px; }
.walk-block h4 { margin: 0 0 10px; font-size: 15px; }
.style-cards { display: flex; flex-direction: column; gap: 8px; }
.style-card { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; font: inherit; transition: .13s; }
.style-card:hover { border-color: #b9d0ce; }
.style-card.sel { border-color: var(--teal); background: var(--sel-bg); }
.sc-door { width: 52px; flex: 0 0 auto; }
.sc-door svg { width: 52px; height: auto; border-radius: 6px; display: block; }
.sc-txt strong { display: block; font-size: 14px; }
.sc-txt small { color: var(--muted); font-size: 12px; display: block; margin: 2px 0; }
.sc-from { font-size: 12px; font-weight: 700; color: var(--teal-d); }
.mode-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.mode-pill { font: inherit; font-size: 12.5px; font-weight: 600; border: 1.5px solid var(--line); background: #fff; padding: 7px 13px; border-radius: 999px; cursor: pointer; }
.mode-pill.sel { border-color: var(--teal); background: var(--sel-bg); color: var(--teal-d); }
.walk-nums { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
.wn-field { display: flex; flex-direction: column; gap: 3px; }
.wn-field label { font-size: 11px; color: var(--muted); }
.wn-field select { font: inherit; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
.mini-step.big { gap: 10px; }
.mini-step.big button { width: 34px; height: 34px; font-size: 18px; }
.mini-step.big span { font-size: 18px; }
.walk-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 22px; border-top: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.walk-run { color: var(--muted); font-size: 14px; }
.walk-run strong { color: var(--teal-d); font-size: 17px; }
@media (max-width: 820px) {
  .approach-grid { grid-template-columns: 1fr; }
  .walk-layout { grid-template-columns: 1fr; }
  .walk-preview { position: static; max-width: 260px; margin: 0 auto; }
}

/* ===== galerij (startpunt) ===== */
.gal-hero { background: linear-gradient(120deg, var(--teal-d), var(--teal)); color: #fff; }
.gal-hero .hero-badge { background: rgba(255,255,255,.16); color: #fff; }
.gal-hero h1 { color: #fff; font-size: 30px; margin: 8px 0; }
.gal-hero .lead { color: rgba(255,255,255,.9); max-width: 680px; margin: 0 auto 18px; }
.hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* knoppen op donkere hero's (galerij + keuzehulp) leesbaar maken */
.gal-hero .btn.primary, .guide-hero .btn.primary {
  background: #fff; color: var(--teal-d); border-color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.gal-hero .btn.primary:hover, .guide-hero .btn.primary:hover { background: #eaf3f1; }
.gal-hero .btn.ghost, .guide-hero .btn.ghost { color: #fff; border-color: rgba(255,255,255,.55); }
.gal-hero .btn.ghost:hover, .guide-hero .btn.ghost:hover { border-color: #fff; background: rgba(255,255,255,.1); }
.gal-heading { margin: 24px 4px 12px; font-size: 20px; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.gal-card {
  text-align: left; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff;
  cursor: pointer; font: inherit; padding: 0; transition: .16s; position: relative; display: flex; flex-direction: column;
}
.gal-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(20,40,40,.12); border-color: #cfe0dd; }
.gal-door { background: linear-gradient(160deg,#f4f1eb,#e9e4da); }
.gal-door svg { width: 100%; height: auto; display: block; }
.gal-info { padding: 12px 14px 6px; }
.gal-title { font-weight: 700; font-size: 15px; }
.gal-tag { color: var(--teal); font-size: 12.5px; font-weight: 600; }
.gal-meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 12px; }
.gal-line { color: var(--muted); }
.gal-price { font-weight: 800; color: var(--teal-d); }
.gal-cta { padding: 8px 14px 14px; color: var(--teal); font-weight: 600; font-size: 13px; }
.gal-foot { text-align: center; margin: 26px 0 6px; }
.gal-foot p { color: var(--muted); margin-bottom: 12px; }

/* ===== deur-tegels in keuzemenu's ===== */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.tile {
  border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font: inherit;
  padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: .14s;
}
.tile:hover { border-color: #b9d0ce; transform: translateY(-2px); }
.tile.sel { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.tile-door { width: 100%; }
.tile-door svg { width: 100%; height: auto; border-radius: 8px; display: block; }
.tile-name { font-size: 12.5px; font-weight: 600; text-align: center; }

/* ===== schilder-modus keuze ===== */
.finish-mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 18px; }
.fmode-card {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; background: #fff; font: inherit;
  border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: .14s;
}
.fmode-card:hover { border-color: #b9d0ce; }
.fmode-card.sel { border-color: var(--teal); background: var(--sel-bg); }
.fmc-ic { font-size: 26px; line-height: 1; }
.fmc-txt { flex: 1; }
.fmc-txt strong { display: block; font-size: 14.5px; }
.fmc-txt small { color: var(--muted); font-size: 12.5px; }
.finish-note { background: #f0f7ee; border-left: 3px solid var(--lime); border-radius: 8px; padding: 12px 14px; margin: 4px 0 16px; }
.finish-note p { margin: 0; font-size: 14px; }

/* ===== beeld-lijnkaarten ===== */
.line-card.img { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.line-card.img .lc-door { background: linear-gradient(160deg,#f4f1eb,#e9e4da); }
.line-card.img .lc-door svg { width: 100%; height: auto; max-height: 190px; display: block; }
.line-card.img .lc-body { padding: 14px 16px 16px; }
.line-card.img h3 { margin: 4px 0; }

/* ===== hoofdnavigatie ===== */
.mainnav-bar { background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); position: sticky; top: 78px; z-index: 40; }
.mainnav { max-width: var(--maxw); margin: 0 auto; display: flex; gap: 4px; padding: 8px 22px; overflow-x: auto; scrollbar-width: none; }
.mainnav::-webkit-scrollbar { display: none; }
.nav-item {
  position: relative; font: inherit; font-weight: 600; font-size: 14px; border: none; background: transparent;
  color: var(--muted); padding: 9px 14px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; gap: 7px;
}
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.on { background: var(--sel-bg); color: var(--teal-d); }
.nav-item .ni-ic { font-size: 16px; }
.nav-item.cart-btn { margin-left: auto; }
.cart-badge { background: var(--lime); color: #fff; font-size: 11px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px; }

/* ===== resultaat-CTA ===== */
.result-cta { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 6px; align-items: center; }
.result-cta .primary.lg { font-size: 16px; }
.quote-fold { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.quote-fold summary { cursor: pointer; font-weight: 600; color: var(--teal); }
.quote-fold .quote-box { margin-top: 14px; }

/* ===== winkelmandje ===== */
.empty-state { text-align: center; padding: 40px 20px; }
.empty-state .es-ic { font-size: 48px; }
.empty-state p { color: var(--muted); margin: 10px 0 18px; }
.cart-list { display: flex; flex-direction: column; gap: 12px; }
.cart-item { display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.ci-thumb { width: 74px; }
.ci-thumb svg { width: 74px; height: 110px; border-radius: 6px; }
.ci-title { font-weight: 700; }
.ci-sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
.ci-actions { display: flex; gap: 14px; }
.link-btn { border: none; background: none; font: inherit; font-size: 13px; color: var(--teal); cursor: pointer; padding: 0; }
.link-btn.danger { color: #b23b2e; }
.ci-right { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.ci-qty { display: flex; align-items: center; gap: 8px; }
.rnd.sm { width: 28px; height: 28px; font-size: 15px; }
.ci-price { font-weight: 800; color: var(--teal-d); }
.cart-summary { margin-top: 18px; background: var(--bg); border-radius: 12px; padding: 16px 18px; }
.cs-line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.cs-line.total { border-top: 2px solid var(--teal); margin-top: 6px; padding-top: 10px; font-size: 20px; font-weight: 800; color: var(--teal-d); }
.cs-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.cart-cta { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }

/* ===== checkout ===== */
.checkout-grid { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }
.co-form h3 { margin-top: 18px; }
.co-form textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; margin: 12px 0; }
.co-summary { background: var(--bg); border-radius: 14px; padding: 18px; position: sticky; top: 14px; }
.co-items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.co-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.coi-thumb svg { width: 40px; height: 60px; border-radius: 4px; }
.coi-price { font-weight: 700; }

/* ===== betaalopties + simulatie ===== */
.pay-grid { grid-template-columns: repeat(3, 1fr); }
.pay-opt { display: flex; flex-direction: column; }
.pay-ic { display: inline-block; width: 40px; height: 26px; border-radius: 5px; margin-bottom: 6px; background: #eee; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.pay-ic.pay-bancontact { background: linear-gradient(90deg,#0a5bd3 50%,#ffd800 50%); }
.pay-ic.pay-kaart { background: linear-gradient(120deg,#eb001b,#f79e1b); }
.pay-ic.pay-overschrijving { background: #cfd8d7; position: relative; }
.pay-ic.pay-overschrijving::after { content: "€"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 800; color: #4a5654; }
.pay-overlay { position: fixed; inset: 0; background: rgba(15,30,30,.55); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 100; }
.pay-modal { background: #fff; border-radius: 16px; padding: 30px 34px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); min-width: 280px; }
.pay-brand { font-weight: 800; color: var(--teal-d); letter-spacing: .5px; }
.pay-amount { font-size: 30px; font-weight: 800; margin: 6px 0 16px; }
.pay-spinner { width: 40px; height: 40px; margin: 0 auto 14px; border: 4px solid #e3e0d9; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
.pay-modal.ok .pay-spinner { border: none; background: var(--lime); border-radius: 50%; position: relative; animation: none; }
.pay-modal.ok .pay-spinner::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 800; }
.pay-status { font-weight: 600; }
.pay-sim-note { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.od-pay { display: inline-block; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 13.5px; margin: 6px 0; }
.od-pay.paid { background: #eaf6e3; color: #3d7a24; }
.od-pay.topay { background: #fbf3e6; color: #9a6a1a; }
@media (prefers-reduced-motion: reduce) { .pay-spinner { animation: none; } }

/* ===== bestelbevestiging ===== */
.order-done { text-align: center; padding: 20px; }
.od-check { width: 64px; height: 64px; border-radius: 50%; background: var(--lime); color: #fff; font-size: 34px; display: grid; place-items: center; margin: 0 auto 14px; }
.od-nr { font-size: 26px; font-weight: 800; color: var(--teal-d); letter-spacing: 1px; margin: 6px 0 14px; }
.od-total { font-size: 18px; font-weight: 700; margin: 14px 0; }
.order-done .btn-row { justify-content: center; }

/* ===== keuzehulp ===== */
.panel.guide { padding: 0; overflow: hidden; }
.guide-hero { background: linear-gradient(120deg, var(--teal-d), var(--teal)); color: #fff; padding: 30px 28px; }
.guide-hero h2 { color: #fff; }
.guide-hero .lead { color: rgba(255,255,255,.9); max-width: 640px; }
.guide-hero .btn { margin-top: 8px; }
.guide-sec { padding: 24px 28px; border-bottom: 1px solid var(--line); }
.guide-sec h3 { font-size: 19px; }
.gs-intro { color: var(--muted); max-width: 720px; }
.gs-tip { background: #f0f7ee; border-left: 3px solid var(--lime); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-top: 14px; }
.core-compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
.core-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.core-cross svg { width: 100%; height: auto; border-radius: 6px; }
.core-card h4 { margin: 10px 0 4px; font-size: 15px; }
.core-card p { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.sound-meter { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sm-lbl { font-size: 11px; color: var(--muted); width: 42px; }
.sm-bar { flex: 1; height: 7px; background: #eceae4; border-radius: 4px; overflow: hidden; }
.sm-bar i { display: block; height: 100%; background: var(--lime); }
.core-card ul { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.core-card .pros li { color: var(--teal-d); }
.core-card .cons li { color: #a06; opacity: .8; }
.db-scale { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.db-row { display: grid; grid-template-columns: 200px 1fr 200px; gap: 12px; align-items: center; }
.db-place { font-weight: 600; font-size: 13.5px; }
.db-track { background: #eceae4; border-radius: 5px; height: 22px; overflow: hidden; }
.db-track i { display: flex; align-items: center; justify-content: flex-end; height: 100%; color: #fff; font-size: 11px; font-weight: 700; padding-right: 8px; border-radius: 5px; }
.db-rec { font-size: 12.5px; color: var(--muted); }
.measure-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.measure-step { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.ms-num { position: absolute; top: -10px; left: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.ms-ic { font-size: 26px; }
.measure-step strong { display: block; margin: 6px 0 4px; }
.measure-step p { font-size: 13px; color: var(--muted); margin: 0; }
.measure-tool { margin-top: 16px; background: var(--bg); border-radius: 12px; padding: 18px; }
.measure-tool h4 { margin: 0 0 10px; }
.mt-inner input[type=range] { width: 100%; accent-color: var(--teal); margin: 8px 0; }
.mt-lbl { font-size: 13px; font-weight: 600; }
.mt-result { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.mt-result strong { font-size: 24px; color: var(--teal-d); }
.mt-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.swing-demo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 520px; }
.swing-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
.sw-svg svg { width: 120px; height: 90px; }
.swing-card strong { display: block; }
.swing-card small { color: var(--muted); }
.faq { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq p { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.guide-cta { padding: 26px 28px; text-align: center; background: var(--bg); }

/* ===== toast ===== */
#toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: .25s; z-index: 60;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 820px) {
  .core-compare, .measure-grid { grid-template-columns: 1fr; }
  .checkout-grid { grid-template-columns: 1fr; }
  .co-summary { position: static; }
  .db-row { grid-template-columns: 1fr; gap: 4px; }
  .cart-item { grid-template-columns: 60px 1fr; }
  .ci-right { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; }
}

/* ===== 3D-deur render ===== */
.prev-toggle { display: flex; gap: 4px; background: var(--bg-2); padding: 4px; border-radius: 999px; width: max-content; margin: 0 auto 10px; }
.pt-btn { font: inherit; font-size: 12.5px; font-weight: 700; border: none; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.pt-btn.on { background: var(--teal); color: #fff; }
.d3-wrap { }
.d3-scene {
  perspective: 1300px; height: 400px; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 20%, #f7f4ee, #e6e0d4);
  border-radius: 16px; overflow: hidden; touch-action: none; cursor: grab; user-select: none;
  border: 1px solid var(--line);
}
.d3-scene:active { cursor: grabbing; }
.d3-stage { position: relative; transform-style: preserve-3d; width: 0; height: 0; }
.d3-leaf { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,.1,.2,1); }
.d3-face { position: absolute; left: 0; top: 0; overflow: hidden; }
.d3-front-inner { position: absolute; inset: 0; box-shadow: inset 0 0 40px rgba(0,0,0,.06); }
.d3-front { box-shadow: 0 30px 40px rgba(0,0,0,.18); }
.d3-hinge { position: absolute; width: 11px; height: 22px; border-radius: 2px;
  background: linear-gradient(180deg,#e2ddd3,#a7a094); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.2); }
.d3-hinge::after { content: ""; position: absolute; inset: 8px 4px; border-radius: 1px; background: rgba(0,0,0,.12); }
.d3-handle { position: absolute; width: 28px; height: 7px; border-radius: 4px; transform: translateZ(8px);
  box-shadow: 0 2px 4px rgba(0,0,0,.35); }
.d3-handle.greep { width: 7px; height: 78px; }
.d3-jamb { position: absolute; background: linear-gradient(120deg,#efeade,#ded7c8); border-radius: 2px; box-shadow: 0 20px 40px rgba(0,0,0,.1); }
.d3-controls { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.d3-btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line-2); background: #fff; color: var(--ink); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
.d3-btn:hover { border-color: var(--teal); color: var(--teal); }
.d3-legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.d3-legend span { font-size: 12.5px; font-weight: 600; background: var(--sel-bg); color: var(--teal-d); padding: 6px 11px; border-radius: 999px; }
.d3-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

/* ===== mobiele verfijning ===== */
@media (max-width: 680px) {
  .site-header { padding: 11px 14px; }
  .site-header .inner { gap: 10px; }
  .site-header > .inner > div:nth-child(2) { flex: 1; min-width: 0; }
  .site-header h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-header .sub { display: none; }
  .logo-mark { width: 38px; height: 38px; flex: 0 0 auto; }
  .mode-switch { padding: 3px; flex: 0 0 auto; }
  .mode-btn { padding: 6px 9px; font-size: 11.5px; }
  .mainnav-bar { position: static; }        /* niet dubbel-sticky op gsm */
  .mainnav { padding: 6px 12px; }
  .nav-item { padding: 8px 11px; font-size: 13px; }
  main { padding: 14px 14px 130px; }
  .panel { padding: 18px; border-radius: 16px; }
  .config-main .panel { padding: 16px; }
  h2 { font-size: 21px; }
  .hero h1 { font-size: 27px; }
  .hero .lead { font-size: 14.5px; }
  .usp-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { padding: 12px 16px; }
  .btn-row { gap: 8px; }
  .btn.lg { padding: 13px 18px; font-size: 15px; }
  #stepper { padding: 12px 14px 0; }
  .step-dot .lbl { display: none; }         /* enkel bolletjes op gsm */
  .step-dot { padding: 6px; }
  .step-dot.active { padding: 6px 12px; }
  .step-dot.active .lbl { display: inline; }
  .result-grid { gap: 16px; }
  .swing-compare { grid-template-columns: 1fr; }
}

/* print */
@media print {
  .site-header, .mainnav-bar, #stepper, #summary-bar, .quote-actions, .btn-row, .quote-box .chk, #toast { display: none !important; }
  .panel { box-shadow: none; border: none; }
  body { background: #fff; }
}

(function () {

  var C = window.CATALOG;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ---- helpers ---------------------------------------------------------- */
  function fmt(n) {
    return "€ " + (Math.round(n * 100) / 100).toFixed(2).replace(".", ",");
  }
  // Toon prijs volgens modus: gezin = incl. btw, aannemer = excl. btw
  function toExcl(n) { return n / (1 + C.meta.vat); }
  function euro(nIncl) {
    return fmt(state.audience === "aannemer" ? toExcl(nIncl) : nIncl);
  }
  function vatLabel() { return state.audience === "aannemer" ? "excl. btw" : "incl. btw"; }
  function finishById(id) {
    for (var g = 0; g < C.finishGroups.length; g++) {
      var grp = C.finishGroups[g];
      for (var f = 0; f < grp.finishes.length; f++) {
        if (grp.finishes[f].id === id) return { finish: grp.finishes[f], group: grp };
      }
    }
    return null;
  }
  function lineById(id) {
    return C.lines.filter(function (l) { return l.id === id; })[0];
  }
  function isWide(width) { return width >= 88; }
  function paintColorById(id) { return C.paintColors.filter(function (p) { return p.id === id; })[0]; }
  function finById(id) { // vriendelijke afwerkingsnaam
    var f = finishById(id); if (f) return f.finish.name;
    if (String(id).indexOf("paint-") === 0) { var pc = paintColorById(id.slice(6)); return pc ? pc.name : id; }
    return id;
  }

  // De weer te geven afwerking, rekening houdend met de schilder-modus
  function activeFinish() {
    if (state.finishMode === "geschilderd") {
      var pc = paintColorById(state.paintColor) || C.paintColors[0];
      return { finish: { id: "paint-" + pc.id, name: "Geschilderd: " + pc.name, swatch: pc.swatch, tags: ["mat"] }, group: { id: "te-verven", name: "Geschilderd op kleur" }, painted: true };
    }
    if (state.finishMode === "schilderklaar") {
      return { finish: { id: "wit-teverven", name: "Schilderklaar wit (zelf te schilderen)", swatch: "#f4f2ec", tags: ["wit"] }, group: { id: "te-verven", name: "Schilderklaar" }, paintable: true };
    }
    return finishById(state.finishId) || finishById("soft-mat-white");
  }

  // materiaaltype voor realistische rendering, afgeleid van tags/swatch
  function materialOf(fObj) {
    var f = fObj.finish;
    var t = f.tags || [];
    if (t.indexOf("marmer") >= 0) return "marble";
    if (t.indexOf("beton") >= 0 || t.indexOf("leisteen") >= 0) return "concrete";
    if (t.indexOf("hout") >= 0 || t.indexOf("eik") >= 0 || t.indexOf("walnoot") >= 0 || (f.swatch || "").indexOf("gradient") >= 0) return "wood";
    return "matte";
  }

  /* ---- state ------------------------------------------------------------ */
  var state = {
    view: "start",     // start | gallery | bouw | config | guide | cart | checkout | done

  // Bereken score per lijn op basis van de antwoorden
  function recommend() {
    var a = state.advice;
    var wishes = { budget: 0, luxe: 0, invisible: 0, glass: 0, sound: 0, wood: 0, paint: 0 };

    ADVICE_QUESTIONS.forEach(function (q) {
      var chosen = (q.options.filter(function (o) { return o.id === a[q.id]; })[0]) || {};
      var at = chosen.attrs || {};
      Object.keys(at).forEach(function (k) { wishes[k] += at[k]; });
    });

    // hoogte-eis bepaalt harde ondergrens
    var needHeight = a.height === "plafond" ? 300 : a.height === "hoog" ? 231.5 : 211.5;

    var scored = C.lines.map(function (line) {
      var s = 0, reasons = [];
      // match wensen tegen lijn-attributen
      Object.keys(wishes).forEach(function (k) {
        if (wishes[k] > 0 && line.attrs[k]) {
          s += wishes[k] * line.attrs[k];
        }
      });
      // hoogte: sluit lijnen uit die niet hoog genoeg gaan
      if (line.attrs.maxHeight < needHeight) {
        s -= 100;
      } else if (needHeight >= 231.5 && line.attrs.maxHeight >= needHeight) {
        s += 8; reasons.push("geschikt voor hoge deuren");
      }
      // badkamer → vocht/tubespaan bonus, endless minder
      if (a.room === "badkamer" && line.id === "te-verven") { s += 4; }
      // berging → budget
      if (a.room === "berging" && line.id === "te-verven") { s += 6; }
      // steel look enkel zinvol bij glas-wens
      if (line.id === "steel-look" && a.light !== "ja" && a.look !== "steel") s -= 8;
      return { line: line, score: s };
    });

    scored.sort(function (x, y) { return y.score - x.score; });
    return scored;
  }

    var L = line.leaf;

    // Te verven Serie 10: per core + model
    if (L[state.coreId] && !L._byFinishGroup && !L._byModel && !L._bySwingFinish) {
      var byModel = L[state.coreId][state.modelId] || L[state.coreId].vlak;
      var tier = byModel[h] || byModel[Object.keys(byModel)[0]];
      return wide ? tier.wide : tier.base;
    }
    // Invisible Flat / Loft: per finishGroup
    if (L._byFinishGroup) {
      var fg = finishById(state.finishId);
      var gid = fg ? fg.group.id : line.finishGroups[0];
      var t = L._byFinishGroup[gid] || L._byFinishGroup[line.finishGroups[0]];
      var th = t[h] || t[Object.keys(t)[0]];
      return wide ? th.wide : th.base;
    }
    // Steel look: per model (+ glasoptie)
    if (L._byModel) {
      var tm = L._byModel[state.modelId] || L._byModel[line.models[0]];
      var tmh = tm[h] || tm[Object.keys(tm)[0]];
      var p = wide ? tmh.wide : tmh.base;
      if (line.glassOptions && state.glassId) {
        var go = line.glassOptions.filter(function (g) { return g.id === state.glassId; })[0];
        if (go) p += go.extra;
      }
      return p;
    }
    // Endless Loft: per swing + finishGroup, breedte-tier op 98cm
    if (L._bySwingFinish) {
      var sw = state.swing || line.swings[0].id;
      var fg2 = finishById(state.finishId);
      var gid2 = fg2 ? fg2.group.id : line.finishGroups[0];
      var t2 = L._bySwingFinish[sw][gid2] || L._bySwingFinish[sw][line.finishGroups[0]];
      var w = state.width || line.widths[0];
      return w >= (L.wideFrom || 98) ? t2.wide : t2.base;
    }
    return 0;
  }

  function calcFrame(line) {
    if (!line || !line.frame) return 0;
    var F = line.frame;
    var h = state.height ? String(state.height) : (line.heights ? String(line.heights[0]) : "201.5");

    if (F.byHeight) { // te verven
      var bh = F.byHeight[h] || F.byHeight[Object.keys(F.byHeight)[0]];
      return bh["400"]; // standaard tot 400mm muur — grootste tarief tonen
    }
    if (F.options) { // invisible flat / steel look → gekozen kastkleur
      var opt = F.options.filter(function (o) { return o.id === state.frameOptId; })[0] || F.options[0];
      return opt.price;
    }
    if (F.bySwingHeight) { // loft
      var sw = state.swing || "trekkend";
      var by = F.bySwingHeight[sw][h] || F.bySwingHeight[sw]["201.5"];
      return by["400"];
    }
    if (F.bySwing) { // endless loft
      var sw2 = state.swing || "trekkend";
      return F.bySwing[sw2]["400"];
    }
    return 0;
  }

  function calcHandle() {
    if (!state.handleId) return 0;
    var h = C.handles.filter(function (x) { return x.id === state.handleId; })[0];
    return h ? h.price : 0;
  }
  function calcLock() {
    var l = C.locks.filter(function (x) { return x.id === state.lockId; })[0];
    return l ? l.extra : 0;
  }
  function calcExtras() {
    var t = 0;
    Object.keys(state.extras).forEach(function (id) {

      if (!q) return;
      var e = C.extras.filter(function (x) { return x.id === id; })[0];

    return t;
  }
  function calcPaint() {
    return state.finishMode === "geschilderd" ? (C.paintService.pricePerDoor || 0) : 0;
  }
  function calcUnit(line) {
    return calcLeaf(line) + calcFrame(line) + calcHandle() + calcLock() + calcPaint();
  }
  function calcTotal(line) {
    return calcUnit(line) * state.qty + calcExtras();

  function startWalk() {
    var bw = state.bouw;
    bw.rows.forEach(function (r) {

      r.advised = rec;
      if (!r.lineId) { // neem advies over als nog niets gekozen
        r.lineId = rec.lineId; r.finishMode = rec.finishMode; r.finishId = rec.finishId;

        ensureValidFinish(r);
      }
    });
    bw.walk = true; bw.idx = 0; render();
  }
  function ensureValidFinish(r) {
    var line = lineById(r.lineId);
    if (r.finishMode === "afgewerkt") {
      var grp = line.finishGroups.filter(function (g) { return g !== "te-verven"; });
      var ok = false;
      grp.forEach(function (gid) {
        var g = C.finishGroups.filter(function (x) { return x.id === gid; })[0];
        if (g && g.finishes.some(function (f) { return f.id === r.finishId && (!line.finishFilter || line.finishFilter.indexOf(f.id) >= 0); })) ok = true;
      });
      if (!ok) {
        if (hasFinishedGroup(line)) r.finishId = firstFinishedOf(line);
        else { r.finishMode = "schilderklaar"; r.finishId = "wit-teverven"; }
      }
    }
    if (r.finishMode !== "afgewerkt" && line.finishGroups.indexOf("te-verven") < 0) {
      r.finishMode = "afgewerkt"; r.finishId = firstFinishedOf(line);
    }
  }
  function applyAdvice(r) {
    var rec = r.advised || recommendForRoom(r);
    r.lineId = rec.lineId; r.finishMode = rec.finishMode; r.finishId = rec.finishId;
    r.paintColor = rec.paintColor; r.lockId = rec.lockId;
    ensureValidFinish(r); render();

    var bw = state.bouw;

    setLineDefaults(line);

    state.finishId = r.finishId || bw.finishId || firstFinishedOf(line) || "wit-teverven";

    state.customHeight = line.customHeight ? Math.max(line.customHeight.min, Math.min(line.customHeight.max, r.height)) : null;
    state.width = nearest(line.widths, r.width);

    if (r.lockId) state.lockId = r.lockId;

  // representatieve afwerking + model voor een lijn (voor stijl-thumbnail)
  function REP_FINISH(l) {
    var map = { "te-verven": "wit-teverven", "invisible-flat": "nature-oak", "steel-look": "black-mat", "loft": "nature-oak", "endless-loft": "wit-teverven" };

    return { fg: fg, model: l.id === "steel-look" ? "1r" : "vlak" };
  }

  // afwerking om te tonen op een stijl-kaart: neem de GEKOZEN kleur als die
  // geldig is voor de lijn, anders een geldige voorbeeldafwerking van de lijn
  function fgForLine(l, row) {
    // geschilderd op kleur → geldig voor elke lijn met te-verven basis
    if (row.finishMode === "geschilderd" && l.finishGroups.indexOf("te-verven") >= 0) {
      var pc = paintColorById(row.paintColor) || C.paintColors[0];
      return { finish: { id: "paint-" + pc.id, name: pc.name, swatch: pc.swatch, tags: ["mat"] } };
    }
    // schilderklaar wit → geldig voor lijnen met te-verven
    if ((row.finishMode || "afgewerkt") === "schilderklaar" && l.finishGroups.indexOf("te-verven") >= 0) {
      return { finish: { id: "wit-teverven", name: "Wit", swatch: "#f4f2ec", tags: ["wit"] } };
    }
    // afgewerkte kleur → gebruik ze als de lijn ze aanbiedt
    var f = finishById(row.finishId);
    if (f && f.group.id !== "te-verven") {
      var okGroup = l.finishGroups.indexOf(f.group.id) >= 0;
      var okFilter = !l.finishFilter || l.finishFilter.indexOf(row.finishId) >= 0;
      if (okGroup && okFilter) return f;
    }
    return REP_FINISH(l).fg;
  }

        } }, [labels[mid]]);
      })));

    var tiles = [];
    if ((row.finishMode || "afgewerkt") === "afgewerkt") {
      line.finishGroups.forEach(function (gid) {
        if (gid === "te-verven") return;

  // kleine SVG-preview van een model
  function miniDoor(m) {
    var svg = '<svg viewBox="0 0 60 120" class="mini-svg">';
    svg += '<rect x="4" y="2" width="52" height="116" rx="2" fill="#e9e6df" stroke="#c9c4ba"/>';
    if (m.glass && m.grid) {
      var cols = m.grid[0], rows = m.grid[1];
      var gw = 44 / cols, gh = 108 / rows;
      svg += '<rect x="8" y="6" width="44" height="108" fill="#cfe0e6" stroke="#333" stroke-width="2"/>';
      for (var c = 1; c < cols; c++) svg += '<line x1="' + (8 + c * gw) + '" y1="6" x2="' + (8 + c * gw) + '" y2="114" stroke="#333" stroke-width="2"/>';
      for (var r = 1; r < rows; r++) svg += '<line x1="8" y1="' + (6 + r * gh) + '" x2="52" y2="' + (6 + r * gh) + '" stroke="#333" stroke-width="2"/>';
    } else if (m.lines) {
      for (var i = 0; i < m.lines; i++) {
        if (m.orient === "h") {
          var y = 20 + i * (80 / Math.max(1, m.lines - 0));
          svg += '<line x1="10" y1="' + y + '" x2="50" y2="' + y + '" stroke="#b9b3a7" stroke-width="1.5"/>';
        } else {
          var x = 14 + i * (34 / Math.max(1, m.lines));
          svg += '<line x1="' + x + '" y1="8" x2="' + x + '" y2="112" stroke="#b9b3a7" stroke-width="1.5"/>';
        }
      }
    }
    svg += '<circle cx="49" cy="62" r="1.8" fill="#8a8378"/></svg>';
    return h("div", { html: svg });
  }

  /* ---- winkelmandje-acties --------------------------------------------- */
  function currentItemLabel(line, fg) {
    return line.name + " · " + (fg ? fg.finish.name : "") + " · " + C.models[state.modelId].name +
      " · " + (line.customHeight ? state.customHeight : state.height) + "×" + state.width + " cm";
  }
  function snapshotConfig() {
    return {
      lineId: state.lineId, finishId: state.finishId, coreId: state.coreId, modelId: state.modelId,
      height: state.height, customHeight: state.customHeight, width: state.width, swing: state.swing,
      hinge: state.hinge, frameOptId: state.frameOptId, lockId: state.lockId, lockColor: state.lockColor,
      glassId: state.glassId, handleId: state.handleId, extras: JSON.parse(JSON.stringify(state.extras)),
    };
  }
  function uid() { return "d" + (state.cart.length + 1) + "-" + state._seq++; }
  function addToCart(goCheckout) {
    var line = lineById(state.lineId);
    var fg = activeFinish();
    var item = {
      uid: state.editingUid || uid(),
      label: currentItemLabel(line, fg),
      lineName: line.name,
      finishName: fg ? fg.finish.name : "",
      cfg: snapshotConfig(),
      unitIncl: calcUnit(line),
      extrasIncl: calcExtras(),
      qty: state.qty,
      thumb: bigDoorSVG(line, fg, true),
    };
    if (state.editingUid) {
      var i = state.cart.map(function (x) { return x.uid; }).indexOf(state.editingUid);
      if (i >= 0) state.cart[i] = item;
      state.editingUid = null;
      toast("Wijziging opgeslagen");
    } else {
      state.cart.push(item);
      toast("Toegevoegd aan winkelmandje");
    }
    state.view = goCheckout ? "checkout" : "cart";
    render();
  }
  function loadCartItem(uidv) {
    var it = state.cart.filter(function (x) { return x.uid === uidv; })[0];
    if (!it) return;
    var c = it.cfg;
    Object.keys(c).forEach(function (k) { state[k] = k === "extras" ? JSON.parse(JSON.stringify(c[k])) : c[k]; });
    state.qty = it.qty;
    state.editingUid = uidv;
    state.view = "config";
    state.step = 8;
    render();
  }
  function removeCartItem(uidv) {
    state.cart = state.cart.filter(function (x) { return x.uid !== uidv; });
    render();
  }
  function cartItemTotal(it) { return it.unitIncl * it.qty + (it.extrasIncl || 0); }
  function cartTotal() { return state.cart.reduce(function (s, it) { return s + cartItemTotal(it); }, 0); }

  function field(id, label, type, req) {
    return h("div", { class: "field" }, [
      h("label", {}, [label + (req ? " *" : "")]),
      h("input", { id: "f-" + id, type: type }, []),

  function priceLine(k, v) { return h("div", { class: "pl" }, [h("span", {}, [k]), h("span", {}, [euro(v)])]); }

  // grote deur-preview in een showroom-scène
  function bigDoor(line, fg) {
    return h("div", { class: "door-shell", html: bigDoorSVG(line, fg, false) });

  /* ====================================================================== *
   *  3D-RENDER van de samengestelde deur (CSS-3D, draaibaar, open/dicht)
   *  Toont scharnieren (aantal ~ hoogte), krukzijde/-hoogte en draairichting.
   * ====================================================================== */

    var T = window.TEXTURES || {};
    var texKey = fg && fg.finish ? fg.finish.id : null;
    var hasTex = !!(texKey && T[texKey] && !(m.glass && m.grid));
    if (hasTex) s += '<pattern id="pt' + u + '" patternUnits="userSpaceOnUse" x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '"><image href="' + T[texKey] + '" x="0" y="0" width="' + dw + '" height="' + dh + '" preserveAspectRatio="xMidYMid slice"/></pattern>';
    s += '</defs>';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="6" fill="#efece6"/>';
    if (hasTex) {
      s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="2" fill="url(#pt' + u + ')"/>';
    } else {
      s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="2" fill="url(#d' + u + ')"/>';
      if (mat === "wood" || mat === "marble" || mat === "concrete") {
        var op = mat === "marble" ? 0.75 : 0.5;
        s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="2" filter="url(#x' + u + ')" opacity="' + op + '"/>';
      }
    }
    s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="2" fill="url(#sh' + u + ')"/>';
    // model
    if (m.glass && m.grid) {
      var stC = isDark ? "#111" : "#23262a";
      var gc = m.grid[0], gr = m.grid[1], gx = dx + 6, gy = dy + 6, gw = (dw - 12) / gc, gh = (dh - 12) / gr;
      s += '<rect x="' + gx + '" y="' + gy + '" width="' + (dw - 12) + '" height="' + (dh - 12) + '" fill="url(#gl' + u + ')" stroke="' + stC + '" stroke-width="3"/>';
      for (var c = 1; c < gc; c++) s += '<line x1="' + (gx + c * gw) + '" y1="' + gy + '" x2="' + (gx + c * gw) + '" y2="' + (gy + dh - 12) + '" stroke="' + stC + '" stroke-width="3"/>';
      for (var r = 1; r < gr; r++) s += '<line x1="' + gx + '" y1="' + (gy + r * gh) + '" x2="' + (gx + dw - 6) + '" y2="' + (gy + r * gh) + '" stroke="' + stC + '" stroke-width="3"/>';
    } else if (m.lines) {
      var lc = isDark ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.15)";
      for (var i = 0; i < m.lines; i++) {
        if (m.orient === "h") { var yy = dy + 24 + i * ((dh - 48) / Math.max(1, m.lines)); s += '<line x1="' + (dx + 8) + '" y1="' + yy + '" x2="' + (dx + dw - 8) + '" y2="' + yy + '" stroke="' + lc + '" stroke-width="1.5"/>'; }
        else { var xx = dx + 18 + i * ((dw - 36) / Math.max(1, m.lines)); s += '<line x1="' + xx + '" y1="' + (dy + 6) + '" x2="' + xx + '" y2="' + (dy + dh - 6) + '" stroke="' + lc + '" stroke-width="1.5"/>'; }
      }
    }
    // krukje
    s += '<circle cx="' + (dx + dw - 8) + '" cy="' + (dy + dh / 2) + '" r="2.5" fill="' + (isDark ? "#ddd" : "#8a8378") + '"/>';
    s += "</svg>";
    return s;
  }

  // draairichting-diagram (deur + scharnierpaal + open-arc)
  function swingSVG(arc, hingeLeft) {
    var hx = hingeLeft ? 16 : 104;
    var s = '<svg viewBox="0 0 120 92" class="swing-svg">';
    s += '<rect x="4" y="78" width="112" height="6" fill="#e6e1d7"/>'; // vloer
    s += '<rect x="' + (hx - 2) + '" y="18" width="4" height="60" fill="#17615f"/>'; // scharnierpaal
    // deur in open stand
    var dir = arc === "out" ? 1 : -1;
    var ang = hingeLeft ? (arc === "out" ? 35 : -35) : (arc === "out" ? -35 : 35);
    s += '<g transform="rotate(' + ang + ' ' + hx + ' 20)">';
    s += '<rect x="' + hx + '" y="16" width="58" height="8" rx="2" fill="url(#swg)"/>';
    s += '</g>';
    // open-boog
    var r = 56;
    s += '<path d="M' + hx + ',20 A' + r + ' ' + r + ' 0 0 ' + (arc === "out" ? (hingeLeft ? 1 : 0) : (hingeLeft ? 0 : 1)) + ' ' + (hx + dir * 0) + ',' + (20 + r) + '" fill="none" stroke="#c9c4ba" stroke-dasharray="3 3"/>';
    s += '<defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49a5f"/><stop offset="1" stop-color="#a9803f"/></linearGradient></defs>';
    s += "</svg>";
    return s;
  }

  // kleur-helpers
  function hexToRgb(hx) { hx = hx.replace("#", ""); if (hx.length === 3) hx = hx.split("").map(function (c) { return c + c; }).join(""); return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)]; }
  function luma(hx) { try { var r = hexToRgb(hx); return 0.299 * r[0] + 0.587 * r[1] + 0.114 * r[2]; } catch (e) { return 200; } }
  function shade(hx, amt) { try { var r = hexToRgb(hx).map(function (v) { return Math.max(0, Math.min(255, v + amt)); }); return "#" + r.map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join(""); } catch (e) { return hx; } }
  function hashStr(s) { var h2 = 0; for (var i = 0; i < s.length; i++) { h2 = (h2 << 5) - h2 + s.charCodeAt(i); h2 |= 0; } return h2; }

  function coreName(line) { var c = line.cores.filter(function (x) { return x.id === state.coreId; })[0]; return c ? c.name : "—"; }

  function swingName(line) { var s = line.swings.filter(function (x) { return x.id === state.swing; })[0]; return s ? s.name : "—"; }
  function frameName(line) {
    if (line.frame.options) { var o = line.frame.options.filter(function (x) { return x.id === state.frameOptId; })[0]; return o ? o.name : line.frame.name; }
    return line.frame.name;

  function lockName() { var l = C.locks.filter(function (x) { return x.id === state.lockId; })[0]; return l ? l.name : "—"; }
  function handleName() { var hd = C.handles.filter(function (x) { return x.id === state.handleId; })[0]; return hd ? hd.name : "—"; }

  function submitQuote() {

    var payload = {
      type: "bestelling",

      ]),
    ]);
    document.body.appendChild(ov);
    var st = ov.querySelector("#pay-status");
    setTimeout(function () { st.textContent = "Betaling verwerken…"; }, 900);
    setTimeout(function () {
      st.textContent = "Betaling geslaagd ✓"; ov.querySelector(".pay-modal").classList.add("ok");
    }, 1800);
    setTimeout(function () { ov.remove(); state.checkout.paid = true; done(); }, 2500);
  }

  function finishOrder(ordernr) {
    var co = state.checkout;
    state.order = {
      nr: ordernr || ("BD-" + (1000 + Math.floor(state._seq * 137 % 9000))),
      total: fmt(cartTotal()),
      email: co.email,
      items: state.cart.slice(),
      delivery: co.delivery,
      payment: co.payment,
      paid: co.payment !== "overschrijving",
    };
    state.cart = [];
    state.view = "done";
    render();
  }

  function renderOrderDone() {
    var o = state.order || {};
    return card("", [
      h("div", { class: "order-done" }, [
        h("div", { class: "od-check" }, ["✓"]),
        h("h2", {}, ["Bedankt voor je bestelling!"]),
        h("p", { class: "lead" }, ["Je bestelling is geregistreerd onder nummer "]),
        h("div", { class: "od-nr" }, [o.nr || "—"]),
        h("p", {}, ["We sturen een bevestiging naar " + (o.email || "je e-mailadres") + ". " +
          (o.delivery === "afhalen" ? "Je kan je deuren afhalen in de toonzaal na bevestiging." : "We nemen contact op voor de levering.")]),
        h("div", { class: "od-pay " + (o.paid ? "paid" : "topay") }, [
          o.paid ? "✓ Betaald (" + (o.payment === "kaart" ? "kredietkaart" : "Bancontact") + ") — simulatie"
                 : "Te betalen via overschrijving — je ontvangt de gegevens per e-mail",
        ]),
        h("div", { class: "od-total" }, ["Totaal: " + (o.total || "")]),
        h("div", { class: "btn-row" }, [
          h("button", { class: "btn primary", onclick: function () { state.step = 0; goView("config"); } }, ["Nog een deur samenstellen"]),
          h("button", { class: "btn ghost", onclick: function () { window.print(); } }, ["🖨 Print bevestiging"]),
        ]),
      ]),
    ]);
  }

  /* ====================================================================== *
   *  KEUZEHULP (buying guide) — helpt particulieren kiezen
   * ====================================================================== */
  function renderGuide() {
    var kids = [
      h("div", { class: "guide-hero" }, [
        h("h2", {}, ["Keuzehulp: zo kies je de juiste binnendeur"]),
        h("p", { class: "lead" }, ["Geen expert? Geen probleem. We leggen in klare taal uit waar je op let — kern, geluid, maatnemen en draairichting — zodat je met een gerust hart kiest."]),
        h("button", { class: "btn primary", onclick: function () { state.step = 1; goView("config"); } }, ["Liever meteen advies op maat? Start de configurator →"]),
      ]),
    ];

    // 1. Deurkern vergelijken
    kids.push(h("section", { class: "guide-sec" }, [
      h("h3", {}, ["1. De kern bepaalt gewicht, geluid en prijs"]),
      h("p", { class: "gs-intro" }, ["Elke deur bestaat uit een kaderhout met een kern. Het type kern bepaalt hoe stevig, stil en duur de deur is."]),
      h("div", { class: "core-compare" }, [
        coreCard("Honingraat", "honingraat", "Lichte kartonnen celstructuur.", ["Voordeligst", "Licht"], ["Minder geluidsisolatie", "Gevoeliger voor stoten"], 2),
        coreCard("Tubespaan", "tubespaan", "Stevige kern met luchtkanalen.", ["Beste prijs/kwaliteit", "Geluidsdempend (dB 32)", "Stevig & schokvast"], [], 4),
        coreCard("Volspaan", "volspaan", "Massieve, volle spaanplaat.", ["Beste geluidsisolatie", "Brandwerend mogelijk"], ["Zwaarder", "Duurder"], 5),
      ]),
      h("p", { class: "gs-tip" }, ["💡 Onze tip: voor de meeste woningen is tubespaan de gulden middenweg. Kies volspaan bij slaapkamers/bureau waar stilte telt of waar een brandwerende deur nodig is."]),
    ]));

    // 2. Geluid
    kids.push(h("section", { class: "guide-sec" }, [
      h("h3", {}, ["2. Hoeveel geluidsisolatie heb je nodig?"]),
      h("div", { class: "db-scale" }, [
        dbRow("Berging / technische ruimte", "Honingraat volstaat", 25, "#c9c4ba"),
        dbRow("Leefruimte / gang", "Tubespaan (dB 32)", 32, "#8bbf2a"),
        dbRow("Slaapkamer / bureau", "Tubespaan of volspaan", 36, "#17615f"),
        dbRow("Home cinema / muziek", "Volspaan, dichte deur", 40, "#0e4948"),
      ]),
      h("p", { class: "gs-tip" }, ["💡 Een zwaardere, dichtere deur dempt meer geluid. Een goede aansluiting van kast en dichting is minstens even belangrijk als de deur zelf."]),
    ]));

    // 3. Opmeten
    kids.push(h("section", { class: "guide-sec" }, [
      h("h3", {}, ["3. Correct opmeten in 3 stappen"]),
      h("div", { class: "measure-grid" }, [
        measureStep("1", "📏", "Meet de breedte", "Meet de muuropening op 3 hoogtes (boven, midden, onder) en noteer de kleinste maat."),
        measureStep("2", "📐", "Meet de hoogte", "Meet links, midden en rechts van vloer tot bovenkant opening. Noteer de kleinste maat."),
        measureStep("3", "🧱", "Meet de muurdikte", "Meet de dikte van de muur op enkele plaatsen — die bepaalt de breedte van de deurkast."),
      ]),
      h("div", { class: "measure-tool" }, [renderMeasureTool()]),
    ]));

    // 4. Draairichting
    kids.push(h("section", { class: "guide-sec" }, [
      h("h3", {}, ["4. Draairichting: links of rechts?"]),
      h("p", { class: "gs-intro" }, ["Ga staan aan de kant waar de deur naar je toe opent. Zitten de scharnieren links? Dan is het een linksdraaiende deur. Rechts? Dan rechtsdraaiend."]),
      h("div", { class: "swing-demo" }, [
        swingCard("links", "Linksdraaiend", "Scharnieren links, kruk rechts."),
        swingCard("rechts", "Rechtsdraaiend", "Scharnieren rechts, kruk links."),
      ]),
    ]));

    // 5. FAQ
    kids.push(h("section", { class: "guide-sec" }, [
      h("h3", {}, ["5. Veelgestelde vragen"]),
      faq("Welke deur voor een badkamer of toilet?", "Kies bij voorkeur een vochtbestendige uitvoering en een WC-/vrij-bezetslot. Onze 'te verven' deuren voor hoge modellen gebruiken vochtwerend MDF."),
      faq("Wat betekent 'verdoken scharnieren'?", "De scharnieren zitten onzichtbaar weggewerkt in de deur en kast. Dat geeft een strakke, moderne look zonder zichtbaar beslag."),
      faq("Wat is een magnetisch slot?", "Bij het sluiten trekt een magneet in de sluitplaat de schoot aan. Geen kletterend geluid en een net, vlak resultaat."),
      faq("Moet ik zelf schilderen?", "Alleen bij de 'te verven' deuren. Alle andere afwerkingen (mat, hout, beton, staal-glas) zijn kant-en-klaar afgewerkt."),
      faq("Kan ik plafondhoge deuren krijgen?", "Ja. Met de Loft-lijnen ga je tot 231,5 cm en met Endless Loft tot 300 cm, volledig op maat."),
    ]));

    kids.push(h("div", { class: "guide-cta" }, [
      h("h3", {}, ["Klaar om te kiezen?"]),
      h("button", { class: "btn primary lg", onclick: function () { state.step = 1; goView("config"); } }, ["Start de configurator met advies →"]),
    ]));

    return card("guide", kids);
  }

  function coreCard(name, coreType, desc, pros, cons, sound) {
    return h("div", { class: "core-card" }, [
      h("div", { class: "core-cross", html: coreCrossSVG(coreType) }, []),
      h("h4", {}, [name]),
      h("p", {}, [desc]),
      h("div", { class: "sound-meter" }, [
        h("span", { class: "sm-lbl" }, ["Geluid"]),
        h("div", { class: "sm-bar" }, [h("i", { style: "width:" + (sound * 20) + "%" }, [])]),
      ]),
      h("ul", { class: "pros" }, pros.map(function (p) { return h("li", {}, ["✓ " + p]); })),
      h("ul", { class: "cons" }, cons.map(function (c) { return h("li", {}, ["– " + c]); })),
    ]);
  }
  function coreCrossSVG(type) {
    var s = '<svg viewBox="0 0 120 60">';
    s += '<rect x="2" y="8" width="116" height="44" rx="2" fill="#e9e3d6" stroke="#c9b98f"/>';
    s += '<rect x="8" y="8" width="6" height="44" fill="#c9a25f"/><rect x="106" y="8" width="6" height="44" fill="#c9a25f"/>';
    if (type === "honingraat") {
      for (var x = 20; x < 104; x += 12) for (var y = 12; y < 50; y += 10) s += '<polygon points="' + x + ',' + y + ' ' + (x + 6) + ',' + (y + 3) + ' ' + (x + 6) + ',' + (y + 8) + ' ' + x + ',' + (y + 11) + ' ' + (x - 6) + ',' + (y + 8) + ' ' + (x - 6) + ',' + (y + 3) + '" fill="none" stroke="#d8b98a" stroke-width="0.8"/>';
    } else if (type === "tubespaan") {
      for (var xx = 22; xx < 104; xx += 11) s += '<rect x="' + xx + '" y="12" width="6" height="36" rx="3" fill="#ffffff" stroke="#cbb98a" stroke-width="0.8"/>';
    } else {
      s += '<rect x="18" y="12" width="86" height="36" fill="#d7c4a0"/>';
    }
    s += "</svg>";
    return s;
  }
  function dbRow(place, rec, db, col) {
    return h("div", { class: "db-row" }, [
      h("span", { class: "db-place" }, [place]),
      h("div", { class: "db-track" }, [h("i", { style: "width:" + ((db - 20) / 22 * 100) + "%;background:" + col }, [db + " dB"])]),
      h("span", { class: "db-rec" }, [rec]),
    ]);
  }
  function measureStep(n, ic, t, d) {
    return h("div", { class: "measure-step" }, [
      h("div", { class: "ms-num" }, [n]),
      h("div", { class: "ms-ic" }, [ic]),
      h("strong", {}, [t]),
      h("p", {}, [d]),
    ]);
  }
  // interactieve opmeethulp: muuropening → aanbevolen deurbreedte
  function renderMeasureTool() {
    var wrap = h("div", { class: "mt-inner" }, []);
    function build() {
      wrap.innerHTML = "";
      var opening = state._mtOpening || 830;
      // mapping muuropening → deurbreedte (op basis van catalogus: opening ≈ breedte + ~76mm marge)
      var doorW = Math.round((opening - 76) / 10) * 10;
      var nearest = [630, 680, 730, 780, 830, 880, 930, 980, 1030].reduce(function (a, b) { return Math.abs(b - doorW) < Math.abs(a - doorW) ? b : a; });
      wrap.appendChild(h("label", { class: "mt-lbl" }, ["Muuropening (breedte): " + opening + " mm"]));
      wrap.appendChild(h("input", { type: "range", min: 700, max: 1100, step: 5, value: opening, oninput: function (e) { state._mtOpening = +e.target.value; build(); } }, []));
      wrap.appendChild(h("div", { class: "mt-result" }, [
        h("span", {}, ["Aanbevolen deurbreedte:"]),
        h("strong", {}, [(nearest / 10) + " cm"]),
      ]));
    }
    build();
    return h("div", {}, [h("h4", {}, ["🔧 Snelle opmeethulp"]), wrap, h("p", { class: "mt-note" }, ["Indicatief. De exacte maat hangt af van kast en afwerking — twijfel je? Wij helpen je graag."])]);
  }
  function swingCard(dir, t, d) {
    var left = dir === "links";
    var s = '<svg viewBox="0 0 120 90">';
    s += '<rect x="' + (left ? 18 : 84) + '" y="15" width="4" height="60" fill="#17615f"/>'; // scharnierpaal
    s += '<path d="M' + (left ? 22 : 98) + ',18 ' + (left ? "A56 56 0 0 1 78 74" : "A56 56 0 0 0 22 74") + '" fill="none" stroke="#c9c4ba" stroke-dasharray="3 3"/>';
    s += '<rect x="' + (left ? 22 : 38) + '" y="18" width="60" height="8" rx="2" fill="#8bbf2a" transform="rotate(' + (left ? 28 : -28) + ' ' + (left ? 22 : 98) + ' 22)"/>';
    s += '<circle cx="' + (left ? 84 : 34) + '" cy="70" r="3" fill="#17615f"/>';
    s += "</svg>";
    return h("div", { class: "swing-card" }, [h("div", { class: "sw-svg", html: s }, []), h("strong", {}, [t]), h("small", {}, [d])]);
  }
  function faq(q, a) {
    return h("details", { class: "faq" }, [h("summary", {}, [q]), h("p", {}, [a])]);
  }

  /* ---- init ------------------------------------------------------------- */
  render();
})();

</script>
