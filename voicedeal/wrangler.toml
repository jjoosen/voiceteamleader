name = "voicedeal"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Client ID van je VoiceDeal-integratie in de Teamleader Marketplace.
# Dit is GEEN secret en mag hier staan. Vul je eigen client id in.
[vars]
TL_CLIENT_ID = "VUL_HIER_JE_TEAMLEADER_CLIENT_ID_IN"

# KV-namespace voor de Teamleader-tokens.
# Maak de namespace aan met:  wrangler kv namespace create TOKENS
# en plak de "id" uit de output hieronder.
[[kv_namespaces]]
binding = "TOKENS"
id = "VERVANG_DOOR_KV_NAMESPACE_ID"

# Secrets (NIET hier zetten — gebruik `wrangler secret put`):
#   wrangler secret put TL_CLIENT_SECRET   # client secret van de VoiceDeal-integratie
#   wrangler secret put ANTHROPIC_API_KEY  # je Anthropic API-key
#   wrangler secret put APP_PASSWORD       # zelfgekozen toegangscode voor de app
